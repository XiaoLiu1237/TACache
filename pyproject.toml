[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacache"
version = "0.4.1"
description = "TACache for Wan2.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.4"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["tacache*"]

